name: SETS format tests

# The build-JSON format is checked on every push: an ImportResult goes
# through build_writer + sets_export and the result is validated against
# warp/data/sets_contract.json. Cargo comes from the bundled baseline and
# no recognition runs, so the job needs pytest + numpy only — no torch,
# no opencv, no network.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy

      - name: Validate the SETS build format
        run: python -m pytest tests/test_sets_schema.py tests/test_sets_export_pipeline.py -v
